<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Rose · actual ASCII</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#d8b9c8;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}main{position:fixed;inset:0}canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:manipulation}.controls{position:absolute;z-index:2;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;align-items:center;max-width:calc(100% - 16px);padding:6px 8px;background:#090509ec;border:1px solid #e58ab329;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .4s}.awake .controls,.controls:focus-within,.controls:hover{opacity:1;pointer-events:auto}button{border:0;border-radius:5px;background:transparent;color:#c0a4b5;font:11px ui-monospace,SFMono-Regular,monospace;min-height:34px;padding:5px 8px;white-space:nowrap;cursor:pointer}button:hover{color:#ffd1e9;background:#ed80b61a}button:focus-visible,input:focus-visible{outline:1px solid #ed80b6;outline-offset:2px}input[type=range]{accent-color:#db70a3;width:100px;min-width:36px}output{font-size:10px;color:#876f80;font-variant-numeric:tabular-nums;min-width:27px}.hint{position:absolute;bottom:max(77px,calc(env(safe-area-inset-bottom) + 65px));left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:#775c6c;opacity:0;transition:opacity .4s;pointer-events:none}.awake .hint{opacity:1}dialog{background:#08070a;color:#b6d4bf;border:1px solid #65505d;border-radius:10px;padding:16px;width:min(850px,96vw);max-height:90svh}dialog::backdrop{background:#000d}dialog p{color:#c4a7b8;font-size:12px;margin:0 0 12px;line-height:1.6}textarea{display:block;width:100%;height:63svh;background:#020403;color:#83c796;border:1px solid #29362e;white-space:pre;resize:none;font:10px/12px ui-monospace,monospace;tab-size:1}dialog footer{display:flex;justify-content:flex-end;gap:12px;margin-top:10px}@media(max-width:440px){.controls{padding:5px;gap:1px}button{font-size:10px;padding:5px 6px}input[type=range]{width:64px}.hint{font-size:9px}}@media(prefers-reduced-motion:reduce){.controls,.hint{transition:none}}
</style></head><body class="awake"><main>
<canvas id="scene" role="img" aria-label="A rose drawn with actual text characters. Pink petals unfold in three dimensions, green leaves grow, and ASCII stars sparkle around it."></canvas>
<div class="hint">tap for controls · space to pause · R to replay</div>
<nav class="controls" aria-label="Animation controls"><button id="play" aria-label="Pause animation">Ⅱ</button><button id="replay" aria-label="Replay bloom">↻ Replay</button><input id="seek" type="range" min="0" max="20" step="0.01" value="0" aria-label="Animation time"><output id="time">0.0</output><button id="speed" aria-label="Change animation speed">1×</button><button id="bloom" aria-label="See full bloom">Bloom</button><button id="text" aria-label="View and copy actual text characters">{ } Text</button><button id="full" aria-label="Fullscreen">⛶</button></nav>
</main><dialog id="textDialog"><p>This is the current frame as actual, selectable text. Color and lighting are applied separately by the renderer.</p><textarea id="rawText" readonly spellcheck="false" aria-label="ASCII characters in the current frame"></textarea><footer><button id="copy">Copy text</button><button id="close">Close</button></footer></dialog>
<script>
(()=>{
'use strict';
/* REAL-TIME TEXT RENDERER. No images, sprite atlases, captured frames, videos,
   encoded media, or external dependencies. Every visible mark is a character
   drawn with CanvasRenderingContext2D.fillText at the screen's native pixel ratio.
   Petals, leaves, and stem are parametric 3D surfaces rasterized into a character
   grid with a depth buffer, surface normals, moving lights, and edge contours. */
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d',{alpha:false});
const COLS=128,ROWS=72,N=COLS*ROWS,CW=10,CH=15.5,W=COLS*CW,H=ROWS*CH,TAU=Math.PI*2;
const depth=new Float32Array(N),light=new Float32Array(N),owner=new Uint8Array(N),material=new Uint8Array(N),uvs=new Float32Array(N),chars=new Uint16Array(N),red=new Uint8Array(N),green=new Uint8Array(N),blue=new Uint8Array(N);
const ramp=".,-:~=+trvxzjfnuaeoq0088$$%%BB@",outline='_/\\|-';
const mono='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';
let t=matchMedia('(prefers-reduced-motion:reduce)').matches?16:0,playing=!matchMedia('(prefers-reduced-motion:reduce)').matches,speed=1,previous=0,lastPaint=0,raf=0,theta=0,co=1,si=0,bloom=0,growth=0,sway=0,headX=0,letterCount=0;
let cssW=1,cssH=1,pixelRatio=1,scale=1,left=0,top=0;
let rng=88123;const random=()=>{rng=(1664525*rng+1013904223)>>>0;return rng/4294967296};
const stars=Array.from({length:240},()=>({x:random()*COLS,y:random()*ROWS,p:random()*TAU,w:.45+random()*1.1,c:random(),s:random(),drift:random()*.06}));
const diamonds=Array.from({length:24},()=>({x:3+random()*(COLS-6),y:4+random()*(ROWS-10),p:random()*TAU,w:.4+random()*.45,size:2+Math.floor(random()*3)}));
const dust=Array.from({length:80},()=>({p:random(),angle:random()*TAU,r:random(),life:random()*2+1}));
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),mix=(a,b,q)=>a+(b-a)*q;
function smooth(a,b,x){const q=clamp((x-a)/(b-a));return q*q*(3-2*q)}
function stemX(y){return .028*Math.sin(y*2.7)+sway*Math.pow(clamp((y+1.9)/2.9),2)}
const surfaces=[];
function mesh(nu,nv,id,kind,fn){const count=(nu+1)*(nv+1);surfaces.push({nu,nv,id,kind,fn,p:new Float32Array(count*3),screen:new Float32Array(count*3),v:new Float32Array(count),h:new Float32Array(count)})}
// Stem, with enough longitudinal resolution to bend smoothly in a breeze.
mesh(10,46,1,2,(u,v)=>{let y=-1.62+2.27*v*growth,r=.047+.022*v,a=u*TAU;return [stemX(y)+r*Math.cos(a),y,r*Math.sin(a),1,v]});
// Leaves have a center vein and two separately folded blades, not flat ovals.
for(const [side,base,start,id]of [[-1,-1.1,1.05,2],[1,-.27,1.8,3]]){
 mesh(16,26,id,2,(u,v)=>{const q=smooth(start,start+3.3,t),fold=2*u-1,len=.88*q,w=.28*Math.pow(Math.sin(Math.PI*v),.78)*q;
 let x=stemX(base)+side*(.08+len*v),y=base+q*(.12+.15*v)+fold*w*.58,z=.04+fold*w*.74+Math.sin(v*Math.PI)*.16*q;
 y+=.10*q*Math.pow(Math.abs(fold),1.6)-.04*Math.sin(v*Math.PI*6)*Math.abs(fold)*q;return [x,y,z,.85+Math.abs(fold)*.15,v]});
}
// Five pointed sepals spread below the opening flower.
for(let k=0;k<5;k++)mesh(5,12,4+k,2,(u,v)=>{const a=k*TAU/5+.2,q=smooth(3.2,6.5,t),r=.06+v*(.23+.2*bloom),w=Math.sin(v*Math.PI)*.065*(2*u-1),y=-1.62+2.27*growth;return [stemX(y)+Math.sin(a)*r+Math.cos(a)*w,y+.12*q-v*(.13+.21*bloom)*q,Math.cos(a)*r-Math.sin(a)*w,1,v]});
// Overlapping whorls. The closed bud is a tapered shell; each whorl unfurls
// independently into a cupped, rolled, rounded petal with a genuinely modeled rim.
const rings=[{n:6,r:1.25,h:.94,width:1.72,off:.25,delay:0,lift:0,bulge:.20},{n:5,r:1.08,h:1.19,width:1.85,off:.83,delay:.10,lift:.025,bulge:.17},{n:5,r:.76,h:1.33,width:1.93,off:.25,delay:.23,lift:.05,bulge:.13},{n:4,r:.46,h:1.4,width:2.02,off:.9,delay:.38,lift:.07,bulge:.10},{n:3,r:.23,h:1.43,width:2.1,off:.4,delay:.48,lift:.09,bulge:.07}];
let petalId=10;
for(let layer=0;layer<rings.length;layer++){const ring=rings[layer];for(let k=0;k<ring.n;k++){
 const id=petalId++,a0=k*TAU/ring.n+ring.off;
 mesh(20,22,id,1,(u,v)=>{
 const w=2*u-1,open=smooth(ring.delay,1,bloom),a=a0+w*ring.width*.5*Math.pow(Math.sin(v*Math.PI*.5),.55)+.22*(1-v)+.10*open*Math.sin(v*Math.PI);
 const closedR=(.27-.032*layer)*Math.pow(Math.sin(Math.PI*v),.72)+.025*v;
 let openR=ring.r*Math.pow(Math.sin(v*Math.PI*.5),.88)*(1-.12*Math.pow(Math.abs(w),3))+ring.bulge*Math.sin(v*Math.PI)*(1-w*w);
 // The rim rolls outward and then turns gently back on itself.
 openR+=.09*Math.sin(v*Math.PI)*Math.sin(v*Math.PI*2+w*.6);
 openR+=.045*Math.sin(a0*2+w*3)*Math.pow(v,5);
 let r=mix(closedR,openR,open);
 let y=-1.62+2.27*growth+ring.lift+mix(1.43,ring.h,open)*v;
 y-=open*(.27*w*w*Math.pow(v,4)+.09*Math.pow(v,7));
 y+=open*.065*Math.sin(a0*2+w*2.4)*Math.pow(v,4);
 const x=stemX(-1.62+2.27*growth)+r*Math.sin(a),z=r*Math.cos(a);
 const rim=.56+.28*Math.pow(v,7)+.18*Math.sin(u*Math.PI);
 return [x,y,z,rim,v];
 });
}}
// Projected triangle rasterizer. The buffer stores material IDs so overlapping
// petals have contours and creases instead of one noisy, flat silhouette.
let keyX=-.4,keyY=.74,keyZ=-.55;
function triangle(s,ia,ib,ic){
 const p=s.p,q=s.screen,aa=ia*3,bb=ib*3,cc=ic*3;
 const ux=p[bb]-p[aa],uy=p[bb+1]-p[aa+1],uz=p[bb+2]-p[aa+2],vx=p[cc]-p[aa],vy=p[cc+1]-p[aa+1],vz=p[cc+2]-p[aa+2];
 let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx,len=Math.hypot(nx,ny,nz);if(len<1e-9)return;nx/=len;ny/=len;nz/=len;
 // Both petal sides are visible. Orient each normal toward the viewer.
 if(nz>.1){nx=-nx;ny=-ny;nz=-nz}
 const diffuse=Math.max(0,nx*keyX+ny*keyY+nz*keyZ),rim=Math.pow(1-Math.abs(nz),2),surface=(s.h[ia]+s.h[ib]+s.h[ic])/3;
 const lighting=clamp((.17+.72*diffuse+.19*rim)*surface);
 const ax=q[aa],ay=q[aa+1],az=q[aa+2],bx=q[bb],by=q[bb+1],bz=q[bb+2],cx=q[cc],cy=q[cc+1],cz=q[cc+2];
 const area=(bx-ax)*(cy-ay)-(by-ay)*(cx-ax);if(Math.abs(area)<.000001)return;
 const x0=Math.max(0,Math.floor(Math.min(ax,bx,cx))),x1=Math.min(COLS-1,Math.ceil(Math.max(ax,bx,cx))),y0=Math.max(0,Math.floor(Math.min(ay,by,cy))),y1=Math.min(ROWS-1,Math.ceil(Math.max(ay,by,cy)));
 const vv=(s.v[ia]+s.v[ib]+s.v[ic])/3;
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
 const px=x+.5,py=y+.5,a=((bx-px)*(cy-py)-(by-py)*(cx-px))/area,b=((cx-px)*(ay-py)-(cy-py)*(ax-px))/area,c=1-a-b;
 if(a<0||b<0||c<0)continue;const z=a*az+b*bz+c*cz,i=y*COLS+x;
 if(z<depth[i]){depth[i]=z;owner[i]=s.id;material[i]=s.kind;light[i]=lighting;uvs[i]=vv}
 }
}
function geometry(){
 growth=smooth(0,4.2,t);bloom=smooth(4.5,16,t);sway=.065*Math.sin(t*.55)*smooth(3,9,t);theta=.13+Math.sin(Math.max(0,t-7)*.34)*.19*smooth(7,13,t);co=Math.cos(theta);si=Math.sin(theta);
 const lightAngle=.13*Math.sin(t*.24);keyX=-.38+lightAngle;keyY=.74;keyZ=-.55;
 depth.fill(Infinity);owner.fill(0);material.fill(0);
 for(const s of surfaces){
 if(s.kind===1&&growth<.75)continue;
 if(s.id===2&&t<1.06||s.id===3&&t<1.81)continue;
 if(s.id>=4&&s.id<=8&&t<3.21)continue;
 for(let j=0;j<=s.nv;j++)for(let i=0;i<=s.nu;i++){
 const n=j*(s.nu+1)+i,o=n*3,v=s.fn(i/s.nu,j/s.nv);let x=v[0]*co+v[2]*si,z=v[2]*co-v[0]*si,y=v[1];
 s.p[o]=x;s.p[o+1]=y;s.p[o+2]=z;s.h[n]=v[3];s.v[n]=v[4];
 s.screen[o]=COLS*.5+x*24;s.screen[o+1]=38-y*14.7-z*4.8;s.screen[o+2]=z-.326*y;
 }
 for(let j=0;j<s.nv;j++)for(let i=0;i<s.nu;i++){const a=j*(s.nu+1)+i,b=a+1,c=a+s.nu+1,d=c+1;triangle(s,a,c,d);triangle(s,a,d,b)}
 }
}
function put(x,y,ch,r,g,b,alpha=1,front=false){x=Math.round(x);y=Math.round(y);if(x<0||x>=COLS||y<0||y>=ROWS)return;let i=y*COLS+x;if(!front&&material[i])return;chars[i]=ch.charCodeAt(0);red[i]=r*alpha;green[i]=g*alpha;blue[i]=b*alpha}
function starfield(){
 chars.fill(32);red.fill(0);green.fill(0);blue.fill(0);
 for(const s of stars){const pulse=.18+.82*Math.pow(.5+.5*Math.sin(t*s.w+s.p),3),r=s.c<.20?220:s.c<.36?135:204,g=s.c<.20?137:s.c<.36?174:210,b=s.c<.20?181:s.c<.36?209:218;
 put(s.x+Math.sin(t*.07+s.p)*.4,((s.y-t*s.drift)%ROWS+ROWS)%ROWS,s.s>.78?'*':s.s>.32?'+':'.',r,g,b,pulse)}
 for(const s of diamonds){const p=Math.pow(Math.max(0,Math.sin(t*s.w+s.p)),6);if(p<.025)continue;const x=s.x+Math.sin(t*.13+s.p)*.5,y=s.y,sz=s.size;
 for(let j=-sz;j<=sz;j++){if(j){const a=p*(1-Math.abs(j)/(sz+1))*.53;put(x,y+j,'|',185,196,211,a);put(x+j,y,'-',185,196,211,a);put(x+j*.55,y+j,'\\',185,196,211,a);put(x+j*.55,y-j,'/',185,196,211,a)}}
 put(x,y,'*',231,235,245,p,true);put(x-1,y,'+',183,200,221,p*.65);put(x+1,y,'+',183,200,221,p*.65)
 }
 // Small rising sparks cluster around the active growth front, then disperse.
 const tipY=38-(-1.62+2.27*growth+1.4*bloom)*14.7,activity=1-smooth(13,18,t);
 for(const p of dust){const a=(t*.24+p.p)%1,spread=3+9*a,x=64+Math.cos(p.angle)*spread*p.r,y=tipY+8-a*17;
 put(x,y,p.r>.65?'*':'+',212,174,201,Math.sin(a*Math.PI)*.55*activity)}
}
function compose(){
 letterCount=0;
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
 const i=y*COLS+x,type=material[i];if(!type)continue;letterCount++;
 const l=light[i],v=uvs[i],own=owner[i],noise=((x*19+y*7+own*11)%29)/29;
 let index=clamp(l*.77+noise*.23),ch=ramp[Math.floor(index*(ramp.length-1))],level=.64+.60*l;
 const emptyLeft=x===0||!material[i-1],emptyRight=x===COLS-1||!material[i+1],emptyUp=y===0||!material[i-COLS],emptyDown=y===ROWS-1||!material[i+COLS];
 const crease=(x>0&&owner[i-1]&&owner[i-1]!==own)||(y>0&&owner[i-COLS]&&owner[i-COLS]!==own);
 if(emptyUp){ch='_';level=Math.max(level,.57)}else if(emptyLeft){ch='/';level=Math.max(level,.55)}else if(emptyRight){ch='\\';level=Math.max(level,.5)}else if(emptyDown){ch='_';level=Math.max(level,.52)}else if(crease&&type===1){ch=(y>0&&owner[i-COLS]!==own)?'-':'|';level*=.65}
 else if(type===2&&own===1){ch=x%3===0?'|':ramp[Math.floor(clamp(.55+l*.35)*(ramp.length-1))]}
 else if(type===2&&(own===2||own===3)&&l>.7){ch='08B%$#{}'[Math.floor(noise*8)]}
 chars[i]=ch.charCodeAt(0);
 if(type===1){red[i]=clamp((237+17*v)*level,0,255);green[i]=clamp((48+32*l+noise*9)*level,0,255);blue[i]=clamp((117+47*l)*level,0,255)}
 else{red[i]=clamp((54+35*l)*level,0,255);green[i]=clamp((161+68*l)*level,0,255);blue[i]=clamp((84+49*l)*level,0,255)}
 }
 // A faint character trail below the stem, drawn as text rather than a blur.
 if(t>3)for(let y=67;y<71;y++)put(64,y,'|',41,85,53,.16);
}
function render(){
 const start=performance.now();geometry();starfield();compose();
 ctx.setTransform(pixelRatio,0,0,pixelRatio,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cssW,cssH);
 ctx.font=`600 ${16*scale}px ${mono}`;ctx.textAlign='left';ctx.textBaseline='alphabetic';
 // Direct vector text at native resolution. No offscreen resampling or blur filter.
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const i=y*COLS+x;if(chars[i]===32)continue;ctx.fillStyle=`rgb(${red[i]},${green[i]},${blue[i]})`;ctx.fillText(String.fromCharCode(chars[i]),left+x*CW*scale,top+(y*CH+13)*scale)}
 ctx.font=`${Math.max(10,16*scale)}px ${mono}`;ctx.textAlign='right';ctx.fillStyle='#e57bb1';ctx.fillText('• t '+t.toFixed(2).padStart(5,'0')+'s',Math.min(cssW-18,left+W*scale-60*scale),Math.max(27,top+55*scale));
 const x=Math.max(20,left+66*scale),foot=Math.min(cssH-75,top+H*scale-25*scale);ctx.textAlign='left';ctx.fillStyle='#726978';ctx.font=`${Math.max(9,15*scale)}px ${mono}`;
 ctx.fillText('rose · real-time ASCII',x,foot-35*scale);ctx.fillText('bloom '+(bloom*100).toFixed(1)+'%   sway '+((theta*180/Math.PI+360)%360).toFixed(2)+'°',x,foot-17*scale);ctx.fillText('letters '+letterCount.toLocaleString('en-US'),x,foot);
 $('seek').value=Math.min(t,20);$('time').value=t.toFixed(1);canvas.dataset.renderMs=(performance.now()-start).toFixed(1);
}
function resize(){cssW=innerWidth;cssH=innerHeight;pixelRatio=Math.min(devicePixelRatio||1,3);canvas.width=Math.round(cssW*pixelRatio);canvas.height=Math.round(cssH*pixelRatio);const portrait=cssH/cssW>1.3;scale=Math.min(cssW/(portrait?790:W),cssH/(H+40));left=(cssW-W*scale)/2;top=(cssH-H*scale)/2;render()}
function frame(now){raf=requestAnimationFrame(frame);if(now-lastPaint<32)return;const dt=previous?Math.min((now-previous)/1000,.1):0;previous=now;lastPaint=now;if(!playing)return;t+=dt*speed;render()}
function sync(){$('play').textContent=playing?'Ⅱ':'▶';$('play').setAttribute('aria-label',playing?'Pause animation':'Play animation')}
$('play').onclick=()=>{playing=!playing;previous=0;sync()};$('replay').onclick=()=>{t=0;playing=true;previous=0;sync();render()};$('seek').oninput=()=>{t=Number($('seek').value);previous=0;render()};$('speed').onclick=()=>{speed=speed===1?2:speed===2?.5:1;$('speed').textContent=speed+'×'};$('bloom').onclick=()=>{t=16;playing=false;sync();render()};
function rawFrame(){let rows=[];for(let y=0;y<ROWS;y++){let row='';for(let x=0;x<COLS;x++)row+=String.fromCharCode(chars[y*COLS+x]);rows.push(row.replace(/ +$/,''))}return rows.join('\n')}
$('text').onclick=()=>{playing=false;sync();$('rawText').value=rawFrame();$('textDialog').showModal()};$('close').onclick=()=>$('textDialog').close();$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('rawText').value);$('copy').textContent='Copied'}catch(e){$('rawText').focus();$('rawText').select();$('copy').textContent='Selected — copy text'}};
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else document.body.classList.remove('awake')}catch(e){document.body.classList.remove('awake')}};
let timer;function wake(){document.body.classList.add('awake');clearTimeout(timer);timer=setTimeout(()=>{if(!document.querySelector('.controls').contains(document.activeElement))document.body.classList.remove('awake')},3200)}
canvas.addEventListener('pointerdown',wake);document.querySelector('.controls').addEventListener('pointerdown',wake);document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,button'))return;if(e.code==='Space'){e.preventDefault();$('play').click()}if(e.key.toLowerCase()==='r')$('replay').click();wake()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);previous=0}else{previous=0;raf=requestAnimationFrame(frame)}});window.addEventListener('resize',resize);sync();resize();wake();raf=requestAnimationFrame(frame);
})();
</script></body></html>
